# U1 deploy (FACTORY-SPEC.md §9.3): build on push to main, deploy to GitHub Pages
# behind the `production` environment, whose required reviewer is Ben.
name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true # a fresh client repo has Pages off; the token holds pages: write
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
